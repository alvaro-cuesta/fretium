<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#6b21a8" />
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="0" y="0" width="512" height="512" rx="72" fill="url(#bgGrad)" />

  <!-- Fretboard grid -->
  <g stroke="white" stroke-width="12" stroke-linecap="round">
    <!-- Vertical strings -->
    <line x1="128" y1="96" x2="128" y2="416" />
    <line x1="192" y1="96" x2="192" y2="432" />
    <line x1="256" y1="96" x2="256" y2="456" />
    <line x1="320" y1="96" x2="320" y2="432" />
    <line x1="384" y1="96" x2="384" y2="416" />

    <!-- Horizontal frets -->
    <line x1="96" y1="144" x2="416" y2="144" />
    <line x1="96" y1="224" x2="416" y2="224" />
    <line x1="96" y1="304" x2="416" y2="304" />
    <line x1="96" y1="384" x2="416" y2="384" />
  </g>

  <!-- Note markers -->
  <circle cx="192" cy="184" r="24" fill="#38bdf8" stroke="#ffffff" stroke-width="4" />
  <circle cx="256" cy="264" r="24" fill="#ec4899" stroke="#ffffff" stroke-width="4" />
  <circle cx="320" cy="344" r="24" fill="#facc15" stroke="#ffffff" stroke-width="4" />
</svg>
