<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1"
    />

    <!-- Basic meta -->
    <title>%PACKAGE_CONFIG_NAME%</title>
    <meta
      name="description"
      content="%PACKAGE_CONFIG_DESCRIPTION%"
    />
    <meta
      name="author"
      content="%PACKAGE_CONFIG_AUTHOR%"
    />
    <meta
      name="application-name"
      content="%PACKAGE_CONFIG_SHORT_NAME%"
    />
    <meta
      name="robots"
      content="index,follow,max-image-preview:large"
    />
    <link
      rel="canonical"
      href="%PACKAGE_HOMEPAGE%"
    />

    <!-- Icons -->
    <link
      rel="icon"
      href="/favicon.ico"
      sizes="any"
    />
    <link
      rel="icon"
      href="/favicon.svg"
      type="image/svg+xml;charset=utf-8"
    />
    <link
      rel="apple-touch-icon"
      href="/apple-touch-icon-180x180.png"
    />
    <meta
      name="theme-color"
      content="%PACKAGE_CONFIG_THEME_COLOR%"
    />

    <!-- OpenGraph -->
    <meta
      property="og:type"
      content="website"
    />
    <meta
      property="og:site_name"
      content="%PACKAGE_CONFIG_SHORT_NAME%"
    />
    <meta
      property="og:locale"
      content="en_US"
    />
    <meta
      property="og:url"
      content="%PACKAGE_HOMEPAGE%"
    />
    <meta
      property="og:title"
      content="%PACKAGE_CONFIG_NAME%"
    />
    <meta
      property="og:description"
      content="%PACKAGE_CONFIG_DESCRIPTION%"
    />
    <meta
      property="og:image"
      content="%PACKAGE_CONFIG_PUBLIC_URL_BASE%/fretium-og-center.png"
    />
    <meta
      name="og:image:alt"
      content="%PACKAGE_CONFIG_NAME%"
    />

    <!-- Twitter -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />
    <meta
      property="twitter:url"
      content="%PACKAGE_HOMEPAGE%"
    />
    <meta
      name="twitter:title"
      content="%PACKAGE_CONFIG_NAME%"
    />
    <meta
      name="twitter:description"
      content="%PACKAGE_CONFIG_DESCRIPTION%"
    />
    <meta
      name="twitter:image"
      content="%PACKAGE_CONFIG_PUBLIC_URL_BASE%/fretium-twitter.png"
    />
    <meta
      name="twitter:image:alt"
      content="%PACKAGE_CONFIG_NAME%"
    />

    <!-- Structured data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebApplication",
            "@id": "%PACKAGE_HOMEPAGE%/#app",
            "name": "%PACKAGE_CONFIG_SHORT_NAME%",
            "alternateName": "%PACKAGE_CONFIG_NAME%",
            "url": "%PACKAGE_HOMEPAGE%",
            "description": "%PACKAGE_CONFIG_DESCRIPTION%",
            "applicationCategory": "MultimediaApplication",
            "applicationSubCategory": "MusicApplication",
            "operatingSystem": "Any (web browser)",
            "browserRequirements": "Requires JavaScript and a modern browser",
            "inLanguage": "en",
            "isAccessibleForFree": true,
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "USD"
            },
            "featureList": [
              "Fretboard diagrams for guitar, bass, ukulele, and other stringed instruments",
              "Chord diagrams",
              "Scale diagrams",
              "Custom tunings",
              "Runs entirely in the browser, no installation required"
            ],
            "keywords": "fretboard, diagram, generator, guitar, bass, ukulele, chords, scales",
            "screenshot": "%PACKAGE_CONFIG_PUBLIC_URL_BASE%/fretium-og-center.png",
            "image": "%PACKAGE_CONFIG_PUBLIC_URL_BASE%/fretium-og-center.png",
            "license": "https://www.gnu.org/licenses/gpl-3.0.html",
            "softwareVersion": "%PACKAGE_VERSION%",
            "author": { "@id": "%PACKAGE_AUTHOR_URL%/#person" },
            "publisher": { "@id": "%PACKAGE_AUTHOR_URL%/#person" },
            "mainEntityOfPage": { "@id": "%PACKAGE_HOMEPAGE%/#website" }
          },
          {
            "@type": "SoftwareSourceCode",
            "@id": "%PACKAGE_CONFIG_REPOSITORY_URL%#source",
            "codeRepository": "%PACKAGE_CONFIG_REPOSITORY_URL%",
            "targetProduct": { "@id": "%PACKAGE_HOMEPAGE%/#app" },
            "license": "https://www.gnu.org/licenses/gpl-3.0.html",
            "author": { "@id": "%PACKAGE_AUTHOR_URL%/#person" }
          },
          {
            "@type": "WebSite",
            "@id": "%PACKAGE_HOMEPAGE%/#website",
            "url": "%PACKAGE_HOMEPAGE%",
            "name": "%PACKAGE_CONFIG_SHORT_NAME%",
            "description": "%PACKAGE_CONFIG_SHORT_DESCRIPTION%",
            "inLanguage": "en",
            "publisher": { "@id": "%PACKAGE_AUTHOR_URL%/#person" },
            "mainEntity": { "@id": "%PACKAGE_HOMEPAGE%/#app" }
          },
          {
            "@type": "Person",
            "@id": "%PACKAGE_AUTHOR_URL%/#person",
            "name": "%PACKAGE_AUTHOR_NAME%",
            "url": "%PACKAGE_AUTHOR_URL%"
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
